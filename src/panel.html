<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Playwright Trace Recorder</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --bg-color: #f3f4f6;
      --text-color: #111827;
      --header-bg: #f3f4f6;
      --border-color: #e5e7eb;
      --input-bg: white;
      --input-border: #d1d5db;
      --btn-record-bg: #059669;
      --btn-record-hover: #047857;
      --btn-stop-bg: #ef4444;
      --btn-stop-hover: #dc2626;
      --btn-secondary-bg: #6b7280;
      --btn-secondary-hover: #4b5563;
      --log-bg: white;
      --trace-bg: white;
      --info-bg: #ecfdf5;
      --info-border: #6ee7b7;
      --info-text: #065f46;
    }

    [data-theme="dark"] {
      --bg-color: #1f2937;
      --text-color: #f3f4f6;
      --header-bg: #1f2937;
      --border-color: #374151;
      --input-bg: #374151;
      --input-border: #4b5563;
      --btn-record-bg: #10b981;
      --btn-record-hover: #059669;
      --btn-stop-bg: #ef4444;
      --btn-stop-hover: #dc2626;
      --btn-secondary-bg: #6b7280;
      --btn-secondary-hover: #4b5563;
      --log-bg: #1f2937;
      --trace-bg: #374151;
      --info-bg: #064e3b;
      --info-border: #10b981;
      --info-text: #6ee7b7;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: var(--bg-color);
      color: var(--text-color);
      height: 100vh;
      transition: background-color 0.2s, color 0.2s;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      height: 100%;
    }

    .main-content {
      display: flex;
      flex-direction: column;
      gap: 20px;
      height: 100%;
    }

    /* ── Header ─────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .version-badge {
      font-size: 11px;
      font-weight: 600;
      background: #e5e7eb;
      color: #374151;
      padding: 2px 8px;
      border-radius: 10px;
    }
    [data-theme="dark"] .version-badge {
      background: #374151;
      color: #e5e7eb;
    }

    /* ── Theme switcher ─────────────────────────────────── */
    .theme-switcher {
      margin-left: auto;
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .theme-btn {
      padding: 6px 8px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: var(--bg-color);
      color: var(--text-color);
      cursor: pointer;
      font-size: 14px;
      transition: background-color 0.15s, border-color 0.15s;
      line-height: 1;
    }

    .theme-btn:hover {
      background-color: var(--border-color);
    }

    .theme-btn.active {
      background-color: var(--border-color);
      font-weight: 600;
    }
    .logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #1a2744, #27ae60);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 16px;
      flex-shrink: 0;
    }
    h1 {
      color: var(--text-color);
      font-size: 1.4rem;
      font-weight: 600;
      margin: 0;
    }
    .variant-badge {
      font-size: 11px;
      font-weight: 600;
      background: #d1fae5;
      color: #065f46;
      padding: 2px 8px;
      border-radius: 10px;
      border: 1px solid #6ee7b7;
    }
    [data-theme="dark"] .variant-badge {
      background: #065f46;
      color: #d1fae5;
    }

    /* ── Status badge ───────────────────────────────────── */
    .status {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 13px;
      margin-bottom: 4px;
      transition: background-color 0.2s, color 0.2s;
    }
    .status-idle {
      background-color: #d1fae5;
      color: #065f46;
    }
    [data-theme="dark"] .status-idle {
      background-color: #065f46;
      color: #d1fae5;
    }
    [data-theme="system"] .status-idle {
      background-color: #d1fae5;
      color: #065f46;
    }
    .status-recording {
      background-color: #fee2e2;
      color: #991b1b;
      animation: pulse-bg 1.4s ease-in-out infinite;
    }
    [data-theme="dark"] .status-recording {
      background-color: #991b1b;
      color: #fee2e2;
    }
    [data-theme="system"] .status-recording {
      background-color: #fee2e2;
      color: #991b1b;
    }
    @keyframes pulse-bg {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.7; }
    }

    /* ── Controls ───────────────────────────────────────── */
    .control-group {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 4px;
      flex-wrap: wrap;
    }
    input[type="text"] {
      flex: 1;
      min-width: 180px;
      padding: 8px 12px;
      border: 1px solid var(--input-border);
      border-radius: 6px;
      font-size: 14px;
      background: var(--input-bg);
      color: var(--text-color);
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="text"]:focus {
      border-color: var(--btn-record-bg);
      box-shadow: 0 0 0 2px rgba(5, 150, 105, 0.2);
    }
    input[type="text"]:disabled {
      background: var(--border-color);
      color: #9ca3af;
    }

    button {
      padding: 8px 18px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: background-color 0.15s, opacity 0.15s;
    }
    .btn-record {
      background-color: var(--btn-record-bg);
      color: white;
    }
    .btn-record:hover {
      background-color: var(--btn-record-hover);
    }
    .btn-stop {
      background-color: var(--btn-stop-bg);
      color: white;
    }
    .btn-stop:hover {
      background-color: var(--btn-stop-hover);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ── Output log ─────────────────────────────────────── */
    .output {
      border: 1px solid var(--border-color);
      padding: 12px 16px;
      background-color: var(--log-bg);
      min-height: 0;
      max-height: 240px;
      overflow-y: auto;
      border-radius: 6px;
      margin-bottom: 10px;
      font-size: 13px;
      line-height: 1.6;
    }
    .output.hidden {
      display: none;
    }
    .output .log-entry {
      margin-bottom: 4px;
    }
    .output .log-ts {
      color: #9ca3af;
      margin-right: 6px;
    }
    [data-theme="dark"] .output .log-ts {
      color: #9ca3af;
    }

    /* ── Output toggle button ───────────────────────────── */
    .output-toggle {
      display: none;
      margin-bottom: 4px;
      padding: 6px 12px;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text-color);
    }
    .output-toggle:hover {
      background-color: var(--border-color);
    }

    /* ── Traces section ─────────────────────────────────── */
    .traces-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    h2 {
      color: var(--text-color);
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 10px;
    }
    .traces-container {
      flex: 1;
      overflow-y: auto;
      border-radius: 6px;
    }
    #traces-list {
      list-style-type: none;
      padding: 0;
      margin: 0;
    }
    #traces-list li {
      background-color: var(--trace-bg);
      padding: 12px 14px;
      margin-bottom: 8px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }
    .trace-meta {
      font-size: 12px;
      color: #9ca3af;
      margin-top: 4px;
    }
    [data-theme="dark"] .trace-meta {
      color: #9ca3af;
    }
    .trace-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .trace-actions button {
      padding: 4px 10px;
      font-size: 12px;
    }
    .btn-download { background: var(--btn-record-bg); color: white; }
    .btn-download:hover { background: var(--btn-record-hover); }
    .btn-delete { background: var(--btn-stop-bg); color: white; }
    .btn-delete:hover { background: var(--btn-stop-hover); }
    .btn-refresh { background: var(--btn-secondary-bg); color: white; }
    .btn-refresh:hover { background: var(--btn-secondary-hover); }

    /* ── Info strip ─────────────────────────────────────── */
    .info-section {
      background-color: var(--info-bg);
      border: 1px solid var(--info-border);
      padding: 10px 14px;
      border-radius: 6px;
      margin-top: 10px;
      font-size: 13px;
      color: var(--info-text);
    }
    .info-section a {
      color: var(--info-border);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="main-content">

    <div class="header">
      <div class="logo">🎭</div>
      <h1>Playwright Trace Recorder</h1>
      <span class="version-badge" id="versionBadge">v0.2.3</span>
      <div class="theme-switcher">
        <button class="theme-btn" id="themeToggleBtn" title="Toggle theme">☀️</button>
      </div>
    </div>

    <div class="control-group">
      <input type="text" id="recordingName" placeholder="Recording name (optional)">
      <button id="recordBtn" class="btn-record">Start Recording</button>
    </div>

    <div class="status status-idle" id="statusBadge">Idle</div>

    <button id="outputToggle" class="output-toggle">Show Recording Log</button>
    <div class="output hidden" id="output">
      <div class="log-entry">Ready to record interactions on the inspected tab.</div>
    </div>

    <div class="info-section">
      Traces are saved locally in the browser. Click <strong>Download</strong> to save a <code>.zip</code> file,
      then open it at <a href="https://trace.playwright.dev" target="_blank" rel="noopener">trace.playwright.dev</a>
      to inspect your recording. No backend required.
    </div>

    <div class="traces-section">
      <h2 style="margin:0 0 10px 0;">Recorded Traces</h2>
      <button id="refreshBtn" class="btn-refresh" style="margin-bottom:10px; padding:4px 10px; font-size:12px;">Refresh</button>
      <div class="traces-container">
        <ul id="traces-list">
          <!-- populated by panel.js -->
        </ul>
      </div>
    </div>

  </div></div>
  <script type="module" src="panel.js"></script>
</body>
</html>
